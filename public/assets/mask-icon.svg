  <!-- Center black dividing strip -->
  <rect x="47" y="2" width="6" height="96" fill="#0a0a0a" />
  <!-- Left black eye patch -->
  <path d="M 45,18 C 22,20 12,42 22,72 C 32,90 45,80 45,80 Z" fill="#0a0a0a" />
  <!-- Right black eye patch -->
  <path d="M 55,18 C 78,20 88,42 78,72 C 68,90 55,80 55,80 Z" fill="#0a0a0a" />
  <!-- Left white slanted eye -->
  <polygon points="41,40 25,52 41,58" fill="#ffffff" />
  <!-- Right white slanted eye -->
  <polygon points="59,40 75,52 59,58" fill="#ffffff" />
</svg>
